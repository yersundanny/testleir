<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🗺️ 스마트 팜 위치 기반 실시간 관제 센터</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --primary: #1b5e20;
            --bg: #f5f7fa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); padding: 20px; }
        header { text-align: center; margin-bottom: 20px; }
        h1 { color: var(--primary); font-size: 24px; }
        .subtitle { color: #546e7a; font-size: 13px; margin-top: 4px; }

        /* 📍 지도 레이아웃 스타일 */
        #map {
            width: 100%; height: 400px; border-radius: 14px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 25px; border: 1px solid #ddd;
        }

        .farm-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;
        }
        .student-card {
            background: white; border-radius: 12px; padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04); border-top: 6px solid #ccc;
        }
        .student-name { font-weight: bold; font-size: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; }
        .status-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; color: white; }
        .data-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        
        /* 🚨 실시간 마커 알림 팝업 전용 스타일 */
        .leaflet-popup-content-value { font-weight: bold; font-size: 14px; margin-top: 5px; }
    </style>
</head>
<body>

    <header>
        <h1>🗺️ GIS 위치 기반 스마트 팜 관제 대시보드</h1>
        <div class="subtitle">접속자의 스마트폰 GPS 연동 및 토양 상태별 실시간 마커 트래킹 시스템</div>
    </header>

    <div id="map"></div>

    <div class="farm-grid" id="farmGrid"></div>

    <script>
        const MQTT_TOPIC = "yousun/smartfarm/c3_multi";
        const farmGrid = document.getElementById('farmGrid');
        
        let map;
        let userLat = 37.5665; // GPS 차단 시 기본값 (서울시청 위도)
        let userLng = 126.9780; // 기본 경도
        
        // 생성된 기기 마커 및 상태를 저장하는 맵 객체
        const devices = {};

        // 1. 📍 브라우저 지오로케이션(GPS) API 호출 및 지도 초기화
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((position) => {
                userLat = position.coords.latitude;
                userLng = position.coords.longitude;
                initMap();
            }, () => {
                console.log("GPS 권한 거부됨. 기본 위치로 지도를 켭니다.");
                initMap();
            });
        } else {
            initMap();
        }

        function initMap() {
            // Leaflet 지도 생성 및 내 위치 중심설정
            map = L.map('map').setView([userLat, userLng], 16);
            
            // 오픈스트리트맵 배경 타일 로드
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            // 현재 접속자 내 핸드폰 위치에 파란색 서클 마커 표시
            L.circle([userLat, userLng], { radius: 15, color: '#1565c0', fillColor: '#2196f3', fillOpacity: 0.6 })
             .addTo(map).bindPopup("<b>📍 현재 내 위치 (스마트폰)</b>").openPopup();
        }

        // 2. ☁️ MQTT 클라우드 서버 커넥션
        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
        client.on('connect', () => { client.subscribe(MQTT_TOPIC); });

        client.on('message', (topic, message) => {
            if (topic === MQTT_TOPIC) {
                try {
                    const data = JSON.parse(message.toString().trim());
                    if (!data.id) return;
                    
                    // 데이터 가공 및 화면 동기화 실행
                    processDeviceData(data);
                } catch (e) { }
            }
        });

        // 3. 🛠️ 핵심 프로세서 : 마커 상태 색상 판별 및 맵 매핑
        function processDeviceData(data) {
            let statusColor = "#4caf50"; // 초록 기본값
            let statusText = "충분 (Good)";

            // 🔴 🟡 🟢 기준치에 따른 핀 컬러 동적 스위칭
            if (data.moisture <= 30) {
                statusColor = "#e53935"; // 빨강
                statusText = "건조 (Warning)";
            } else if (data.moisture <= 60) {
                statusColor = "#ffb300"; // 노랑
                statusText = "보통 (Moist)";
            }

            const tempDisplay = (data.temperature === -127 || data.temperature === 85) ? "오류" : `${data.temperature.toFixed(1)}°C`;

            // 기기가 지지도 상에 처음 잡힌 경우 마커 좌표 생성
            if (!devices[data.id]) {
                // 한 강의실 안에서 여러 장치가 겹치는 현상을 막기 위해 GPS 반경에 미세한 난수 오프셋 배정
                const offsetLat = userLat + (Math.random() - 0.5) * 0.0015;
                const offsetLng = userLng + (Math.random() - 0.5) * 0.0015;

                // 커스텀 원형 바늘핀 생성
                const marker = L.circleMarker([offsetLat, offsetLng], {
                    radius: 12,
                    fillColor: statusColor,
                    color: "#ffffff",
                    weight: 2,
                    fillOpacity: 0.9
                }).addTo(map);

                devices[data.id] = { marker: marker, lat: offsetLat, lng: offsetLng };
            }

            // 실시간 상태에 맞춰 마커의 색상 갱신 및 팝업창 정보 바인딩
            devices[data.id].marker.setStyle({ fillColor: statusColor });
            devices[data.id].marker.bindPopup(`
                <div style="font-family:sans-serif;">
                    <b style="font-size:14px; color:#263238;">🪴 장치 ID: ${data.id}</b><br>
                    <div class="leaflet-popup-content-value" style="color:${statusColor};">상태: ${statusText}</div>
                    <hr style="margin:5px 0; border:none; border-top:1px solid #eee;">
                    습도: <b>${data.moisture}%</b> | 온도: <b>${tempDisplay}</b>
                </div>
            `);

            // 하단 바둑판 카드 레이아웃 업데이트
            updateCardUI(data, statusColor, statusText, tempDisplay);
        }

        function updateCardUI(data, statusColor, statusText, tempDisplay) {
            const cardId = `card-${btoa(encodeURIComponent(data.id)).replace(/=/g, '')}`;
            let cardNode = document.getElementById(cardId);

            if (!cardNode) {
                cardNode = document.createElement('div');
                cardNode.id = cardId;
                cardNode.className = 'student-card';
                farmGrid.appendChild(cardNode);
            }

            cardNode.style.borderTopColor = statusColor;
            cardNode.innerHTML = `
                <div class="student-name">
                    <span>🪴 ${data.id}</span>
                    <span class="status-badge" style="background:${statusColor}">${statusText}</span>
                </div>
                <div class="data-row">
                    <span class="data-label">💧 토양 습도</span>
                    <span class="data-value" style="color:#0288d1;">${data.moisture} %</span>
                </div>
                <div class="data-row">
                    <span class="data-label">🌡️ 토양 온도</span>
                    <span class="data-value" style="color:#e65100;">${tempDisplay}</span>
                </div>
            `;
        }
    </script>
</body>
</html>
