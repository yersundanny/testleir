<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leir : 실시간 멀티 환경 관제 시스템</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --primary: #113f2f; /* Leir 프로젝트 전용 딥 그린 */
            --accent: #2e7d32;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); padding: 20px; }
        header { text-align: center; margin-bottom: 25px; }
        h1 { color: var(--primary); font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
        .subtitle { color: #607d8b; font-size: 13px; margin-top: 6px; }
        
        .counter-badge {
            background: #e8f5e9; color: var(--accent); padding: 6px 18px; border-radius: 20px;
            display: inline-block; margin: 12px 0; font-weight: bold; font-size: 14px;
            box-shadow: 0 2px 8px rgba(17,63,47,0.06);
        }

        #map {
            width: 100%; height: 380px; border-radius: 16px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.06); margin-bottom: 30px; border: 1px solid #e0e0e0;
        }

        .farm-grid {
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); 
            gap: 22px; 
            margin-bottom: 25px;
        }
        
        .student-card {
            background: var(--card-bg); border-radius: 14px; padding: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); border-top: 6px solid #cfd8dc;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }

        .student-name { font-size: 18px; font-weight: bold; margin-bottom: 16px; color: #263238; display: flex; justify-content: space-between; align-items: center; }
        .status-tag { font-size: 11px; padding: 3px 9px; border-radius: 12px; color: white; font-weight: bold; }
        
        .data-row { display: flex; justify-content: space-between; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px dashed #f0f0f0; align-items: center; }
        .data-label { font-size: 14px; color: #78909c; }
        .data-value { font-size: 24px; font-weight: bold; }
        .time-value { font-size: 13px; font-weight: 600; color: #546e7a; text-align: right; }

        .terminal-container {
            background: #1a1a1a; color: #90a4ae; border-radius: 14px; padding: 18px;
            font-family: monospace; font-size: 12px; text-align: left; max-width: 1100px; margin: 40px auto 0 auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        .terminal-body { height: 90px; overflow-y: auto; white-space: pre-wrap; }
    </style>
</head>
<body>

    <header>
        <h1>Leir : 환경 통합 관제 센터</h1>
        <div class="subtitle">배포된 무선 모듈이 실시간으로 동기화되어 통합 에코시스템 대시보드를 구성합니다.</div>
        <div class="counter-badge" id="studentCounter">🌿 활성화된 Leir 노드: 0대</div>
    </header>

    <div id="map"></div>
    <div class="farm-grid" id="farmGrid"></div>

    <div class="terminal-container">
        <div style="color: #fff; margin-bottom: 8px; font-weight: bold; letter-spacing: 0.5px;">🛰️ Leir 클라우드 네트워크 스트림 로그</div>
        <div class="terminal-body" id="terminalBody">시스템 연결 및 데이터 신호를 대기 중입니다...</div>
    </div>

    <script>
        const MQTT_TOPIC = "leir/ecosystem/multi_live"; 
        
        const farmGrid = document.getElementById('farmGrid');
        const terminalBody = document.getElementById('terminalBody');
        const studentCounter = document.getElementById('studentCounter');
        
        let map;
        let userLat = 37.5665; 
        let userLng = 126.9780; 
        const activeDevices = {};

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((position) => {
                userLat = position.coords.latitude;
                userLng = position.coords.longitude;
                initMap();
            }, () => { initMap(); });
        } else { initMap(); }

        function initMap() {
            map = L.map('map').setView([userLat, userLng], 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);

            L.circle([userLat, userLng], { radius: 12, color: '#113f2f', fillColor: '#2e7d32', fillOpacity: 0.4 }).addTo(map);
        }

        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
        
        client.on('connect', () => {
            appendLog("[SYSTEM]: Leir 네트워크 메인 서버 동기화 완료.");
            client.subscribe(MQTT_TOPIC);
        });

        client.on('message', (topic, message) => {
            if (topic === MQTT_TOPIC) {
                try {
                    const data = JSON.parse(message.toString().trim());
                    if (!data.id) return; 
                    
                    appendLog(`[데이터 스트림] ${data.id} ➔ 토양 습도: ${data.moisture}% | 토양 온도: ${data.temperature}°C`);
                    
                    let config = { color: "#2e7d32", text: "안정 (Good)" }; 
                    if (data.moisture <= 30) {
                        config = { color: "#d32f2f", text: "주의 (Dry)" }; 
                    } else if (data.moisture <= 60) {
                        config = { color: "#f57c00", text: "모니터링 (Moist)" }; 
                    }

                    const tempStr = (data.temperature === -127 || data.temperature === 85) ? "센서 확인" : `${data.temperature.toFixed(1)}°C`;

                    // 최초 연결 시 시간 기록 및 객체 생성
                    if (!activeDevices[data.id]) {
                        const rLat = userLat + (Math.random() - 0.5) * 0.0016;
                        const rLng = userLng + (Math.random() - 0.5) * 0.0016;

                        const marker = L.circleMarker([rLat, rLng], {
                            radius: 11, fillColor: config.color, color: "#ffffff", weight: 2, fillOpacity: 0.9
                        }).addTo(map);

                        activeDevices[data.id] = { 
                            marker: marker,
                            connectedAt: new Date() // 최초 연결 시간 기록
                        };
                        
                        const totalConnected = Object.keys(activeDevices).length;
                        studentCounter.innerText = `🌿 활성화된 Leir 노드: ${totalConnected}대`;
                    }
                    
                    const device = activeDevices[data.id];
                    const localTime = device.connectedAt.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
                    const utcTime = device.connectedAt.toISOString().substring(11, 19) + " UTC";
                    const durationStr = getDurationString(device.connectedAt);

                    device.marker.setStyle({ fillColor: config.color });
                    device.marker.bindPopup(`<b>📦 기기 노드: ${data.id}</b><br><span style="color:${config.color}; font-weight:bold;">상태: ${config.text}</span><br>습도: ${data.moisture}% / 온도: ${tempStr}<br><small>🕒 연결: ${localTime} (${utcTime})</small>`);

                    updateStudentCardPage(data, config, tempStr);

                } catch (e) { }
            }
        });

        function updateStudentCardPage(data, config, tempStr) {
            const domId = `leir-card-${btoa(encodeURIComponent(data.id)).replace(/=/g, '')}`;
            let cardElement = document.getElementById(domId);

            if (!cardElement) {
                cardElement = document.createElement('div');
                cardElement.id = domId;
                cardElement.className = 'student-card';
                farmGrid.appendChild(cardElement); 
            }

            const device = activeDevices[data.id];
            // 현지 시간(24H 포맷) 및 표준시(UTC) 변환
            const localTime = device.connectedAt.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            const utcTime = device.connectedAt.toISOString().substring(11, 19) + " UTC";
            const currentDuration = getDurationString(device.connectedAt);

            cardElement.style.borderTopColor = config.color;
            cardElement.innerHTML = `
                <div class="student-name">
                    <span>📦 ${data.id}</span>
                    <span class="status-tag" style="background:${config.color}">${config.text}</span>
                </div>
                <div class="data-row">
                    <span class="data-label">💧 토양 습도</span>
                    <span class="data-value" style="color:#0288d1;">${data.moisture} %</span>
                </div>
                <div class="data-row">
                    <span class="data-label">🌡️ 토양 온도</span>
                    <span class="data-value" style="color:#e65100;">${tempStr}</span>
                </div>
                <div class="data-row" style="align-items: flex-start; flex-direction: column; gap: 4px;">
                    <span class="data-label">🕒 최초 연결 시간</span>
                    <span class="time-value" style="text-align: left;">${localTime} (현지) / ${utcTime}</span>
                </div>
                <div class="data-row">
                    <span class="data-label">⏳ 연결 유지 시간</span>
                    <span id="${domId}-duration" class="data-value" style="font-size: 16px; color: var(--accent);">${currentDuration}</span>
                </div>
            `;
        }

        // 경과 시간을 문자열로 계산하는 함수
        function getDurationString(connectedAt) {
            const diffMs = new Date() - connectedAt;
            const diffSec = Math.floor(diffMs / 1000);
            const min = Math.floor(diffSec / 60);
            const sec = diffSec % 60;
            const hrs = Math.floor(min / 60);
            const displayMin = min % 60;

            let result = "";
            if (hrs > 0) result += `${hrs}시간 `;
            if (min > 0 || hrs > 0) result += `${displayMin}분 `;
            result += `${sec}초`;
            return result;
        }

        // 1초마다 모든 카드의 연결 유지 시간을 실시간으로 업데이트하는 타이머
        setInterval(() => {
            for (const id in activeDevices) {
                const domId = `leir-card-${btoa(encodeURIComponent(id)).replace(/=/g, '')}`;
                const durationElement = document.getElementById(`${domId}-duration`);
                if (durationElement) {
                    durationElement.innerText = getDurationString(activeDevices[id].connectedAt);
                }
            }
        }, 1000);

        function appendLog(text) {
            const now = new Date();
            const logLine = document.createElement('div');
            logLine.style.marginBottom = "2px";
            logLine.innerHTML = `<span style="color:#607d8b">[${now.toLocaleTimeString()}]</span> ${text}`;
            terminalBody.appendChild(logLine);
            terminalBody.scrollTop = terminalBody.scrollHeight;
        }
    </script>
</body>
</html>
